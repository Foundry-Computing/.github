name: Bug Report
description: Report a reproducible defect with sanitized evidence.
title: "bug: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include secrets, credentials, personal data, or confidential material.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Affected repository or product
      placeholder: forge-core
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.3 or abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime, hardware, browser, or deployment target
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Provide sanitized evidence only.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
  - type: dropdown
    id: regression
    attributes:
      label: Regression status
      options:
        - unknown
        - yes
        - no
    validations:
      required: true
  - type: dropdown
    id: security_impact
    attributes:
      label: Security impact
      options:
        - none known
        - possible
        - confirmed
    validations:
      required: true
